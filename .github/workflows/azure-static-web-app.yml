# Deploy su Azure Static Web Apps (piano Free).
#
# Configurazione una tantum:
# 1. Nel portale Azure creare la risorsa "Static Web App" (piano Free),
#    con origine collegata a questo repository GitHub, ramo main.
# 2. In "Manage deployment token" copiare il token.
# 3. In GitHub (Settings > Secrets and variables > Actions) creare il secret
#    AZURE_STATIC_WEB_APPS_API_TOKEN con quel valore.
#
# Le pull request ricevono automaticamente un ambiente di anteprima.

name: Deploy Azure Static Web App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    name: Build e deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pubblica la build già testata (nessuna ricompilazione)
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    name: Chiusura ambiente anteprima
    runs-on: ubuntu-latest
    steps:
      - uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'close'
